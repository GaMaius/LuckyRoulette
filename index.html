
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lucky Strike | Premium Social Casino</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    :root {
      --gold-primary: #fbbf24;
      --gold-secondary: #f59e0b;
      --bg-deep: #09090b;
    }

    body {
      font-family: 'Pretendard', sans-serif;
      background-color: var(--bg-deep);
      color: #f4f4f5;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      overflow-x: hidden;
    }

    input, textarea {
      user-select: text;
    }

    /* Smooth Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    /* Animation Keyframes */
    @keyframes reel-spin {
      0% { transform: translateY(-2px); filter: blur(0px); }
      50% { transform: translateY(2px); filter: blur(1px); }
      100% { transform: translateY(-2px); filter: blur(0px); }
    }
    .reel-spin {
      animation: reel-spin 0.15s linear infinite;
    }

    @keyframes fade-in-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-up {
      animation: fade-in-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Glass Effect */
    .glass {
      background: rgba(24, 24, 27, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .gold-glow {
      box-shadow: 0 0 20px rgba(251, 191, 36, 0.15);
    }
  </style>
