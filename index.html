      -webkit-tap-highlight-color: transparent;

    .reel-spin {
      animation: reel-spin 0.1s linear infinite;

    }
    .custom-scrollbar::-webkit-scrollbar-track {

    }

      border-radius: 10px;
    }
  </style>
